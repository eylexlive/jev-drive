[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-drive"
version = "0.1.0"
description = "Jev (TypeSafe's decision model) chooses a simulated car's manoeuvres around random road hazards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-drive = "jev_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_drive = ["web/*.html", "web/dist/*", "web/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
